name: Tests de PBIdouille

on:
  pull_request:
    branches: [experimental, stable]
  push:
    branches: [experimental, stable, 'validation/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / ${{ matrix.qt.api }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        qt:
          - api: pyqt5
            package: PyQt5==5.15.11
          - api: pyside6
            package: PySide6==6.12.0
    env:
      PYTHONUTF8: '1'
      QT_API: ${{ matrix.qt.api }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Installer la bibliothèque graphique de Qt sous Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1
      - name: Installer les dépendances de test
        run: >-
          python -m pip install --only-binary=:all: QtPy==2.4.3 openpyxl==3.1.5 "${{ matrix.qt.package }}"
      - name: Exécuter les tests
        run: python tests/lancer_tests.py
